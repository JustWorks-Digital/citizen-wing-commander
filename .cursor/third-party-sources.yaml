# Accepted third-party data sources for Citizen Wing Commander.
#
# Agents (Cursor AI):
# - Read this file BEFORE fetching Star Citizen / trade / starmap data.
# - Prefer status: accepted sources for the matching purpose. Do not ask the user
#   which site to use when an accepted source already covers the need.
# - When you discover a useful new source and successfully use it, ADD an entry
#   here (status: trial first; promote to accepted after a successful fixture fetch
#   or repeated use). Include purpose, url, and used_by paths.
# - Never delete entries yourself unless the user asks. Humans prune bad sources.
#
# Humans:
# - Delete or set status: rejected on anything unreliable.
# - Keep used_by in sync when moving scripts/fixtures.

schema_version: 1

sources:
  - id: sc-wiki-starmap-locations
    status: accepted
    purpose:
      - locations
      - starmap
      - location-images
    label: Star Citizen Wiki starmap locations
    url: https://api.star-citizen.wiki/api/locations
    docs_url: https://api.star-citizen.wiki/locations
    used_by:
      - scripts/fetch-sc-fixtures.mjs
      - scripts/fetch-location-images.mjs
      - lib/fixtures/locations.json
      - lib/fixtures/locationImages.json
      - public/icons/locations/
    notes: >
      Paginated JSON API of in-game starmap locations (name, slug, type, system,
      parent). Primary source for location name fixtures. Rows include images[]
      (starcitizen.tools thumbnails) when available — fetch-location-images
      downloads those into public/icons/locations and maps slug → file.
    added: "2026-11-07"
    last_verified: "2026-11-10"

  - id: uex-commodities
    status: accepted
    purpose:
      - commodities
      - cargo-types
    label: UEX Corp commodities
    url: https://api.uexcorp.uk/2.0/commodities
    docs_url: https://uexcorp.space/api/documentation/id/get_commodities/
    used_by:
      - scripts/fetch-sc-fixtures.mjs
      - lib/fixtures/commodities.json
    notes: >
      Full commodity list with codes/slugs/kinds. Primary source for cargo type
      fixtures. No auth required for this endpoint. Colors joined from UEX
      /items (commodity categories) color/color2 when present; otherwise kind
      fallback crate pairs in fetch-sc-fixtures.mjs.
    added: "2026-11-07"
    last_verified: "2026-11-07"

  - id: uex-items-commodity-colors
    status: accepted
    purpose:
      - commodity-colors
      - cargo-crate-colors
    label: UEX Corp items (commodity colors)
    url: https://api.uexcorp.uk/2.0/items
    docs_url: https://uexcorp.space/api/documentation/id/get_items/
    used_by:
      - scripts/fetch-sc-fixtures.mjs
      - lib/fixtures/commodities.json
    notes: >
      Items endpoint exposes named color/color2. Fetched for commodity item
      categories (36, 87) and joined onto commodities via id_item. Often empty
      for commodities today — fixture still stores fields + kind fallback.
    added: "2026-11-07"
    last_verified: "2026-11-07"

  - id: uex-vehicles-ships
    status: accepted
    purpose:
      - ships
      - vehicles
      - cargo-capacity
    label: UEX Corp vehicles (spaceships)
    url: https://api.uexcorp.uk/2.0/vehicles
    docs_url: https://uexcorp.space/api/documentation/id/get_vehicles/
    used_by:
      - scripts/fetch-sc-fixtures.mjs
      - scripts/sync-ships.mjs
      - lib/fixtures/ships.json
      - db/schema.ts
      - app/api/ships/route.ts
    notes: >
      Ship/vehicle list including cargo SCU capacity (`scu`). Fixture filters to
      spaceships. Synced into Postgres `ships` via `npm run db:sync-ships` for
      the session ship dropdown (currently C2 Hercules + Mk V Centaurus).
    added: "2026-11-07"
    last_verified: "2026-11-07"

  - id: sc-wiki-commodity-icons
    status: accepted
    purpose:
      - commodity-icons
      - cargo-icons
    label: Star Citizen Wiki commodity icons
    url: https://starcitizen.tools/Category:Commodity_icons
    docs_url: https://starcitizen.tools/Category:Commodity_icons
    used_by:
      - scripts/fetch-commodity-icons.mjs
      - public/icons/commodities/
      - lib/fixtures/commodityIcons.json
    notes: >
      MediaWiki category of in-game commodity / inventory SVGs. Fetched via
      starcitizen.tools api.php; prefer Inv Icon *.svg, with kind-level
      fallbacks (Food, Medical, Metal, …) and Default. Manifest maps UEX
      commodity slugs → public/icons/commodities filenames.
    added: "2026-11-07"
    last_verified: "2026-11-07"

  - id: sc-wiki-commodity-crate-images
    status: accepted
    purpose:
      - commodity-colors
      - cargo-crate-colors
      - cargo-crate-images
    label: Star Citizen Wiki commodities (crate / product images)
    url: https://api.star-citizen.wiki/api/commodities
    docs_url: https://api.star-citizen.wiki/commodities
    used_by:
      - scripts/fetch-commodity-crate-colors.mjs
      - lib/fixtures/commodityCrateColors.json
      - public/icons/commodities/crates/
      - lib/fixtures/commodityColors.ts
    notes: >
      Wiki commodities API returns per-substance images — kind cargo-box
      renders (Cargo - Metal.png, …) or unique product photos. Script
      downloads unique images, samples UI hex from the picture, and maps
      slugs for resolveCommodityColorHex. UEX item color/color2 are often
      empty, so this is the preferred visual color source.
    added: "2026-11-09"
    last_verified: "2026-11-09"

  - id: uex-terminals-outdoor-freight
    status: accepted
    purpose:
      - outdoor-freight-elevators
      - loading-docks
      - terminals
    label: UEX Corp terminals (outdoor freight elevators)
    url: https://api.uexcorp.uk/2.0/terminals
    docs_url: https://uexcorp.space/api/documentation/id/get_terminals/
    used_by:
      - scripts/fetch-sc-fixtures.mjs
      - lib/fixtures/locations.json
    notes: >
      Terminal rows expose has_freight_elevator (hangar/common) and
      has_loading_dock (outdoor / external freight elevator). We join
      has_loading_dock place names onto wiki location fixtures as
      hasOutdoorFreightElevator. Unknown / false → no UI icon.
    added: "2026-11-07"
    last_verified: "2026-11-07"

  - id: uex-terminals-location-shops
    status: accepted
    purpose:
      - location-shops
      - quantum-travel-reason
      - terminals
    label: UEX Corp terminals (location shops)
    url: https://api.uexcorp.uk/2.0/terminals
    docs_url: https://uexcorp.space/api/documentation/id/get_terminals/
    used_by:
      - scripts/fetch-location-shops.mjs
      - lib/fixtures/locationShops.json
      - lib/fixtures/locationShops.ts
    notes: >
      Same terminals feed, grouped by matched wiki location into shop brands
      (Platinum Bay, Cargo Center, Casaba Outlet, …) for quantum-travel Reason
      dropdowns and MCP list_location_shops / set_quantum_travel_reason.
    added: "2026-11-11"
    last_verified: "2026-11-11"

  - id: sc-wiki-hauling-ranks
    status: accepted
    purpose:
      - hauling-reputation-ranks
      - mission-ranks
    label: Star Citizen Wiki — Hauling reputation ranks
    url: https://starcitizen.tools/Hauling
    docs_url: https://starcitizen.tools/Hauling
    used_by:
      - lib/missions/missionRank.ts
      - lib/fixtures/missionRanks.json
    notes: >
      Covalex / hauling career progression table: Trainee, Rookie, Junior,
      Member, Experienced, Senior, Master (plus Not Eligible). Contract titles
      often embed "{Level} Rank - …"; we store `rank` separately as the level
      name only (no “Rank” suffix).
    added: "2026-11-09"
    last_verified: "2026-11-09"

  - id: uex-star-systems
    status: accepted
    purpose:
      - star-systems
      - offer-star-system
    label: UEX Corp star systems
    url: https://api.uexcorp.uk/2.0/star_systems
    docs_url: https://uexcorp.space/api/documentation/
    used_by:
      - lib/fixtures/starSystems.json
      - lib/missions/starSystem.ts
      - lib/api/externalEndpoints.mjs
    notes: >
      Full galaxy list with is_available_live. Our fixture keeps live-only rows
      today (Stanton, Pyro, Nyx). Catalog missions store offerStarSystemSlug
      (where the offer was seen); no DB default — backfill existing to stanton.
    added: "2026-11-09"
    last_verified: "2026-11-09"

  - id: rsi-ark-starmap-orbits
    status: trial
    purpose:
      - starmap-orbits
    label: RSI ARK Starmap (orbital bake)
    url: https://robertsspaceindustries.com/api/starmap
    docs_url: https://robertsspaceindustries.com/starmap
    used_by:
      - scripts/fetch-starmap.mjs
      - lib/fixtures/starmap.json
      - lib/api/externalEndpoints.mjs
    notes: >
      POST star-systems/{CODE} + celestial-objects/{CODE} for distanceAu /
      latitudeDeg / longitudeDeg. Useful for body orbits; surface POIs collapse
      to the parent planet so checklist hop distances prefer CitizenHQ XYZ.
    added: "2026-11-09"
    last_verified: "2026-11-09"

  - id: citizenhq-positions
    status: trial
    purpose:
      - location-distances
      - location-positions
    label: CitizenHQ starmap positions (XYZ meters)
    url: https://citizenhq.space/api/v1/positions
    docs_url: https://citizenhq.space/api
    used_by:
      - scripts/fetch-location-positions.mjs
      - lib/fixtures/locationPositions.json
      - lib/starmap/distance.ts
      - lib/api/externalEndpoints.mjs
    notes: >
      GET /positions?system=stanton|pyro|nyx returns per-POI x/y/z in meters
      (origin = system star) plus qtValid. Matched onto locations.json by name
      for offline Euclidean QT-style distances between checklist stops.
      In-system only — cross-system hops have no straight-line distance.
    added: "2026-11-09"
    last_verified: "2026-11-09"
